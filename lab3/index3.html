<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTELA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index3.css">
</head>
<body>

    <header class="header">
        <img src="img/Frame.svg" alt="HOTELA" class="logo">
        <button type="button" class="btn-connect">Подключиться сейчас</button>
    </header>

    <main class="container">

        <section class="core-section" aria-label="Главный баннер">
            <img src="img/hero-photo.png" alt="" class="core-section__photo">
            
            <aside class="qr-code" aria-label="QR-код для демо">
                <img src="img/qr-code.png" alt="QR-код" class="qr-code__image">
                <section class="qr-code__text" aria-label="Текст о демо">
                    <p class="qr-code__title">Попробуйте демо</p>
                    <p class="qr-code__description">Наведите камеру <br>смартфона на QR-код</p>
                </section>
            </aside>
            
        </section>

    </main>

</body>
</html>
