<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы об услугах - HOTELA</title>
    <link rel="stylesheet" href="index3.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="reviews.css">
</head>
<body>
    <header class="header">
        <a href="index3.html"><img src="img/Frame.svg" class="logo" alt="Логотип HOTELA"></a>
        <nav class="page-nav">
            <a href="catalog.html">Каталог</a>
            <a href="cart.html">Корзина</a>
            <div id="user-status"></div>
            <a href="auth.html" id="auth-link" class="auth-link">Войти</a>
        </nav>
    </header>

    <main class="container">
        <section class="reviews-form-container fade-in">
            <h1 class="text-h2">Оставить отзыв</h1>
            <form id="review-form" novalidate>
                <div class="form-group">
                    <label for="service-select" class="required-label">Купленная услуга</label>
                    <select id="service-select" class="service-select" required>
                        <option value="">Загрузка списка услуг...</option>
                    </select>
                    <div class="error-msg" data-error-for="service-select"></div>
                </div>
                <div class="form-group">
                    <label for="review-text" class="required-label">Текст отзыва</label>
                    <textarea id="review-text" class="review-textarea" minlength="20" required
                        placeholder="Напишите отзыв, минимум 20 символов"></textarea>
                    <div class="error-msg" data-error-for="review-text"></div>
                </div>
                <div id="review-form-message" class="form-message" role="status"></div>
                <button type="submit" id="send-review-btn" class="btn-connect review-submit" disabled>
                    Отправить отзыв
                </button>
            </form>
        </section>

        <section class="reviews-list-section">
            <h2 class="text-h2">Последние отзывы</h2>
            <div id="reviews-list"></div>
        </section>
    </main>

    <script src="reviews.js"></script>
    <script src="session.js"></script>
</body>
</html>
