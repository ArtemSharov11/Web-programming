<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отзывы об услугах - HOTELA</title>
    <link rel="stylesheet" href="index3.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="reviews.css">
    <style>

    </style>
</head>
<body>
    <header class="header">
        <a href="index3.html"><img src="img/Frame.svg" class="logo" alt="Логотип HOTELA"></a>
        <nav style="display: flex; gap: 20px;">
            <a href="catalog.html" style="text-decoration:none; color:black;">Каталог</a>
            <a href="cart.html" style="text-decoration:none; color:black;">Корзина</a>
            <div id="user-status" style="display: flex; align-items: center; gap: 15px;">
            </div>
            <a href="auth.html" id="auth-link" style="background: #9EF01A; padding: 5px 15px; border-radius: 20px; text-decoration: none; color: black; font-weight: 500;">Войти</a>
        </nav>
    </header>

    <main class="container">
        <section class="reviews-form-container fade-in">
            <h1 class="text-h2" style="margin-bottom: 20px;">Оставить отзыв</h1>
            
            <label class="text-body-gray-30">Выберите услугу, которую вы заказывали:</label>
            <select id="service-select" class="service-select">
                <option value="">Загрузка списка услуг...</option>
            </select>

            <textarea id="review-text" class="review-textarea" placeholder="Напишите ваш отзыв здесь (минимум 20 символов)..."></textarea>
            <div id="review-error" class="error-msg" style="color: red; margin-bottom: 15px; display: none;"></div>

            <button id="send-review-btn" class="btn-connect" style="position:static; width: 100%;">Отправить отзыв</button>
        </section>

        <section class="container" style="margin-top: 50px;">
            <h2 class="text-h2">Последние отзывы</h2>
            <div id="reviews-list" style="margin-top: 20px;">
            </div>
        </section>
    </main>

    <script src="reviews.js"></script>
    <script src="session.js"></script>
</body>
</html>
