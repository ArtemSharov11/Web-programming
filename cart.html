<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина покупок - HOTELA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="animation.css">
    <link rel="stylesheet" href="index3.css">
    <link rel="stylesheet" href="tablet.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="phone.css" media="(max-width: 320px)">
    <link rel="stylesheet" href="catalog.css">
</head>
<body>

    <header class="header">
        <a href="index3.html" style="display: flex; align-items: center;">
            <img src="img/Frame.svg" alt="Логотип HOTELA" class="logo">
        </a>
        
        <div style="display: flex; align-items: center; gap: 20px;">
            <nav style="display: flex; gap: 15px; margin-right: 20px; align-items: center;">
                <a href="catalog.html" style="text-decoration: none; color: #000;">Каталог</a>
                <a href="favorites.html" style="text-decoration: none; color: #000;">Избранное</a>
                <a href="auth.html" id="auth-link" style="background: #9EF01A; padding: 10px 20px; border-radius: 20px; text-decoration: none; color: black; font-weight: 500;">Войти</a>
                <div id="user-status" style="display: flex; align-items: center; gap: 15px;">
                </div>
            </nav>
            <a href="index3.html" class="btn-connect" style="position: static; text-decoration: none;">На главную</a>
            <button type="button" class="burger-menu" id="burgerToggle">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="catalog-intro fade-in">
            <h1 class="text-h2">Ваша корзина</h1>
            <p class="text-body-gray-30">Управляйте вашими заказами и услугами</p>
        </section>

        <div class="cart-summary container" style="margin-bottom: 3rem;">
            <div id="cart-total-block" style="background: #F1F1F1; padding: 2.5rem; border-radius: 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
                <div>
                    <p class="text-body-gray-30">Общая стоимость:</p>
                    <span id="total-price" class="text-banner" style="font-size: 3rem; color: #000;">$0</span>
                </div>
                <button id="checkout-btn" class="footer-cta__button" style="padding: 1rem 3rem; font-size: 1.2rem; cursor: pointer; border: none;">
                    Оформить покупку
                </button>
            </div>
        </div>

        <div id="catalog-container" class="catalog-grid container">
        </div>
    </main>

    <footer class="container" style="margin-top: 5rem; padding-bottom: 2rem;">
        <p class="site-footer__copyright">© 2022 Hoteza Web. Все права защищены.</p>
    </footer>

    <script src="cart.js"></script>
    <script src="session.js"></script>
    <script src="animation.js"></script>
</body>
</html>
