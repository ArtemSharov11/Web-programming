<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход и Регистрация - HOTELA</title>
    <link rel="stylesheet" href="index3.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="header">
        <a href="index3.html"><img src="img/Frame.svg" alt="" class="logo"></a>
    </header>

    <main class="container">
        <div class="auth-container">
            <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <button onclick="showTab('login')" class="cat-btn">Вход</button>
                <button onclick="showTab('register')" class="cat-btn">Регистрация</button>
            </div>

            <div id="loginSection">
                <h1 class="text-h2">Вход</h1>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="loginPass" required>
                    </div>
                    <button type="submit" class="btn-reg active">Войти</button>
                </form>
            </div>

            <div id="registerSection" style="display: none;">
                <h1 class="text-h2">Регистрация</h1>
                <form id="regForm">
                    <div class="form-group"><label>Фамилия</label><input type="text" id="lastName" required><div class="error-msg">Введите фамилию</div></div>
                    <div class="form-group"><label>Имя</label><input type="text" id="firstName" required><div class="error-msg">Введите имя</div></div>
                    <div class="form-group"><label>Отчество</label><input type="text" id="middleName"></div>
                    <div class="form-group"><label>Телефон (РБ)</label><input type="text" id="phone" placeholder="+375..."><div class="error-msg">Неверный формат</div></div>
                    <div class="form-group"><label>Email</label><input type="email" id="email" required><div class="error-msg">Неверный email</div></div>
                    <div class="form-group"><label>Дата рождения</label><input type="date" id="birthDate" required><div class="error-msg">Вам должно быть 16+ лет</div></div>
                    <div class="form-group"><label>Никнейм</label><div style="display:flex;gap:5px;"><input type="text" id="nickname" readonly><button type="button" id="genNickBtn" class="cat-btn">🌀</button></div></div>
                    <div class="form-group">
                        <label>Способ задания пароля</label>
                        <select id="passMethod"><option value="manual">Вручную</option><option value="auto">Автоматически</option></select>
                    </div>
                    <div class="form-group"><label>Пароль</label><input type="password" id="pass1"><div class="error-msg">Пароль не подходит</div></div>
                    <div class="form-group"><label>Повторите пароль</label><input type="password" id="pass2"></div>
                    <div class="form-group"><input type="checkbox" id="agreeCheck"> Согласен с правилами</div>
                    <button type="submit" id="regBtn" class="btn-reg">Зарегистрироваться</button>

                </form>
            </div>
        </div>
    </main>

    <script>
        function showTab(tab) {
            document.getElementById('loginSection').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerSection').style.display = tab === 'register' ? 'block' : 'none';
        }
    </script>    
    <script src="bad_passwords.js"></script>
    <script src="auth.js"></script>
</body>
</html>
