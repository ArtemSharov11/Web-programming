<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог услуг - HOTELA</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="animation.css">
    <link rel="stylesheet" href="index3.css">
    <link rel="stylesheet" href="tablet.css" media="(max-width: 768px)">
    <link rel="stylesheet" href="phone.css" media="(max-width: 320px)">
    <link rel="stylesheet" href="catalog.css">
</head>
<body>

    <header class="header">

        <a href="index3.html" style="display: flex; align-items: center;">
            <img src="img/Frame.svg" alt="Logo" class="logo">
        </a>
        
        <div class="header-actions">
            <nav class="header-nav" aria-label="Основная навигация">
            <a href="catalog.html" style="text-decoration:none; color:black;">Каталог</a>
            <a href="favorites.html" style="text-decoration:none; color:black;">Избранное</a>
            <a href="cart.html" style="text-decoration:none; color:black;">Корзина</a>
            </nav>
            <button type="button" class="burger-menu" id="burgerToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div class="side-menu" id="sideMenu">
        <nav class="side-menu__nav">
            <a href="index3.html">Главная</a>
            <a href="index3.html#tariffs">Тарифы</a>
            <a href="catalog.html" style="color: #9EF01A;">Каталог услуг</a>
            <a href="favorites.html">Избранное</a>
            <a href="cart.html">Корзина</a>
            <hr>
            <p class="side-menu__text">Подключиться сейчас</p>
        </nav>
    </div>
    <div class="overlay" id="overlay"></div>

    <main class="container">
        <section class="catalog-intro fade-in">
            <h1 class="text-h2">Демо-каталог для гостя</h1>
            <p class="text-body-gray-30">Посмотрите, как гость видит услуги вашего отеля в своем браузере</p>
        </section>
        <section class="catalog-controls container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Поиск услуги по названию или описанию...">
            </div>

            <div class="filters-row">

                <select id="sort-select">
                    <option value="default">Сортировать по...</option>
                    <option value="price-asc">Цена: дешевле</option>
                    <option value="price-desc">Цена: дороже</option>
                    <option value="name-asc">Название: А-Я</option>
                    <option value="rating-desc">Рейтинг: высокий</option>
                </select>

                <div class="category-list" id="category-list">
                    <button class="cat-btn active" data-category="all">Все</button>
                </div>
            </div>

            <div class="filter-range">
                <label>
                    Цена от
                    <input type="number" id="price-min" min="0" placeholder="0">
                </label>
                <label>
                    Цена до
                    <input type="number" id="price-max" min="0" placeholder="100">
                </label>
                <label>
                    Рейтинг от
                    <select id="rating-min">
                        <option value="">Любой</option>
                        <option value="4">4.0</option>
                        <option value="4.5">4.5</option>
                        <option value="4.8">4.8</option>
                    </select>
                </label>
                <button id="apply-filters" class="cat-btn">Применить фильтры</button>
                <button id="reset-filters" class="cat-btn" type="button">Сбросить</button>
            </div>
        </section>

        <div id="catalog-container" class="catalog-grid container"></div>
        <div class="pagination container" style="display: flex; justify-content: center; align-items: center; gap: 20px; margin: 2rem 0;">
            <button id="prev-page" class="cat-btn">← Назад</button>
            <span id="current-page-info" class="text-body-30">Страница 1 из 1</span>
            <button id="next-page" class="cat-btn">Вперед →</button>
        </div>
    </main>

    <footer class="container" style="margin-top: 5rem; padding-bottom: 2rem;">
        <p class="site-footer__copyright">© 2022 Hoteza Web. Все права защищены.</p>
    </footer>

    <script src="catalog.js"></script>
    <script src="animation.js"></script>
</body>
</html>
